spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

openrouter:
  api-url: https://openrouter.ai/api/alpha/decisions
  api-key: ${OPENROUTER_API_KEY:}
  model: typesafe/jev-1.13

jev:
  access-password: ${JEV_ACCESS_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs

exchange-rate:
  fallback-usd-to-brl: 5.20

processing:
  logs-per-request: 2
  max-concurrency: 5

tabnews:
  api-url: https://www.tabnews.com.br/api/v1

newsletter:
  ai:
    api-url: https://openrouter.ai/api/v1/chat/completions
    api-key: ${OPENROUTER_API_KEY:}
    model: google/gemini-2.5-flash-lite

omnivoice:
  url: ${OMNIVOICE_URL:http://127.0.0.1:8001}
  audio-directory: ${OMNIVOICE_AUDIO_DIRECTORY:./data/newsletter-audio}
  api-key: ${OMNIVOICE_API_KEY:}

supabase:
  storage:
    url: ${SUPABASE_URL:}
    bucket: ${SUPABASE_STORAGE_BUCKET:newsletter-audio}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
