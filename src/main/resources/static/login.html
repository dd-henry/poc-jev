<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JEV | Acesso restrito</title>
    <style>
        :root { color-scheme: dark; --bg: #080b12; --panel: #111722; --line: #263246; --muted: #9ba8bd; --text: #f4f7fb; --accent: #73e0c1; }
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: var(--text); font-family: Inter, system-ui, sans-serif; background: radial-gradient(circle at 85% 0%, #1d3b42 0, transparent 34%), var(--bg); }
        main { width: min(420px, calc(100% - 40px)); padding: 32px; border: 1px solid var(--line); border-radius: 20px; background: rgba(17, 23, 34, .92); }
        .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
        h1 { margin: 12px 0 10px; font-size: 2rem; letter-spacing: -.04em; }
        p { color: var(--muted); line-height: 1.5; }
        label { display: block; margin: 26px 0 8px; color: var(--muted); font-size: .9rem; }
        input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; outline: none; background: var(--bg); color: var(--text); font: inherit; }
        input:focus { border-color: var(--accent); }
        button { width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 10px; background: var(--accent); color: #071112; font-weight: 800; cursor: pointer; }
        a { display: block; margin-top: 20px; color: var(--accent); text-align: center; text-decoration: none; font-size: .9rem; }
        .error { color: #feb2b2; }
    </style>
</head>
<body>
<main>
    <div class="eyebrow">JEV · acesso privado</div>
    <h1>Entrar no projeto</h1>
    <p>Informe a senha compartilhada para acessar a triagem e a documentação técnica.</p>
    <form method="post" action="/login">
        <input type="hidden" name="username" value="friends">
        <label for="password">Senha de acesso</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Acessar JEV</button>
    </form>
    <a href="/">← Voltar ao portfólio</a>
</main>
</body>
</html>
